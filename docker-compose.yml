services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - bunker_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  game:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: bunker_game
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      XRADAR_BASE_URL: ${XRADAR_BASE_URL:-}
    ports:
      - "3000:3000"

volumes:
  bunker_mongo:
